<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сокращатель ссылок</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Сократить ссылку</h1>

    <form id="shorten-form" autocomplete="off">
      <input
        id="url-input"
        type="text"
        placeholder="Вставьте ссылку, которую нужно укоротить"
        aria-label="Оригинальная ссылка"
        required
      />
      <button type="submit" id="submit-btn">Сократить</button>
    </form>

    <p id="error" class="error" hidden></p>

    <div id="result" class="result" hidden>
      <a id="result-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      <button id="copy-btn" type="button">Копировать</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
